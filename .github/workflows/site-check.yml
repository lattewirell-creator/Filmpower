name: Kolla sajten
# Visar vilken version av appen som ligger ute på filmpower.vercel.app just nu.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -D headers.txt -o app.html "https://filmpower.vercel.app/nyheter/?t=$(date +%s)"
          echo "--- svarshuvuden"; grep -iE "^(HTTP|age|cache-control|x-vercel-cache|last-modified|etag)" headers.txt
          echo "--- version i appen"
          for m in CLAP_STRIPES SEAL_PATH p-runby compose-fab tab-following; do printf "%s: " $m; grep -c "$m" app.html || true; done
          echo "--- utan cache-buster"; curl -s -D h2.txt -o app2.html https://filmpower.vercel.app/nyheter/; grep -iE "^(age|x-vercel-cache|cache-control)" h2.txt; printf "CLAP_STRIPES: "; grep -c CLAP_STRIPES app2.html || true
          echo "--- api"; curl -s https://filmpower.vercel.app/api/me; echo
          echo "--- AI-versioner av sidorna (204 = ingen, 200 = finns)"; for p in home nyheter; do printf "%s: " $p; curl -s -o /dev/null -w "%{http_code}\n" "https://filmpower.vercel.app/api/me?page=$p"; done
          echo "--- sidskriptet finns:"; grep -c "__fpPage" app.html || true
          echo "--- priser i vanliga hemsidan"; curl -s "https://filmpower.vercel.app/index.html?original=$(date +%s)" | grep -o 'class="price">[^<]*' || true
          echo "--- priser i AI-versionen"; curl -s -D h3.txt "https://filmpower.vercel.app/api/me?page=home&t=$(date +%s)" -o ov.html; head -1 h3.txt; grep -o 'class="price">[^<]*' ov.html || true; grep -c "__fpPage" ov.html || true
          echo "--- felsökning (väntar på ny deploy)"; for i in $(seq 1 24); do curl -s "https://filmpower.vercel.app/api/me?page=home&debug=1&t=$i" | grep -q '"override"' && break; sleep 10; done; for p in home nyheter; do curl -s "https://filmpower.vercel.app/api/me?page=$p&debug=1&t=$(date +%s)"; echo; done
      - name: Vercels status för de senaste commitarna
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/commits?per_page=12" --jq '.[].sha'); do
            msg=$(gh api "repos/${{ github.repository }}/commits/$sha" --jq '.commit.message' | head -1)
            echo "== ${sha:0:7} $msg"
            gh api "repos/${{ github.repository }}/commits/$sha/statuses" --jq '.[] | "   \(.context): \(.state) - \(.description)"' | sort -u
          done
