name: Testa nyhetsboten
on:
  workflow_dispatch:
  push:
    paths: ['api/bot.js', 'scripts/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/bot-check.mjs
